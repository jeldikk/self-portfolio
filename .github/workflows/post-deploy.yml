name: Post-Deploy E2E Tests

on:
  repository_dispatch:
    types:
      - amplify-deployment-complete

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: ["22"]
      fail-fast: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: ./packages/e2e

      - name: Verify deployment health
        run: |
          DEPLOYMENT_URL="${{ github.event.client_payload.deployment_url }}"
          echo "Verifying deployment at: $DEPLOYMENT_URL"
          
          for i in {1..10}; do
            if curl -f -m 5 "$DEPLOYMENT_URL" > /dev/null 2>&1; then
              echo "✅ Deployment is ready"
              exit 0
            fi
            echo "⏳ Attempt $i/10: Waiting for deployment..."
            sleep 3
          done
          echo "⚠️ Deployment verification timed out, proceeding with tests"

      - name: Run E2E tests
        run: npm run test
        working-directory: ./packages/e2e
        env:
          BASE_URL: ${{ github.event.client_payload.deployment_url }}
          PLAYWRIGHT_TIMEOUT: 30000
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.event.client_payload.environment || 'unknown' }}-${{ matrix.node-version }}
          path: packages/e2e/playwright-report/
          retention-days: 30

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            packages/e2e/test-results/results.xml
          check_name: E2E Test Results - ${{ github.event.client_payload.environment || 'Amplify' }}

      - name: Notify Amplify webhook on success
        if: success()
        run: |
          echo "✅ E2E tests passed for ${{ github.event.client_payload.environment || 'unknown' }} environment"
          echo "Deployment URL: ${{ github.event.client_payload.deployment_url }}"
          echo "Workflow Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notify Amplify webhook on failure
        if: failure()
        run: |
          echo "❌ E2E tests failed for ${{ github.event.client_payload.environment || 'unknown' }} environment"
          echo "Please check the logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1

