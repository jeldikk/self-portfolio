name: Post-Deploy E2E Tests

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed
    branches:
      - develop
      - main

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: ["22"]
      fail-fast: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: ./packages/e2e

      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 30
          for i in {1..60}; do
            if curl -f https://portfolio-develop.amplifyapp.com/ > /dev/null 2>&1 || curl -f https://portfolio.amplifyapp.com/ > /dev/null 2>&1; then
              echo "✅ Deployment is ready"
              exit 0
            fi
            echo "⏳ Attempt $i/60: Waiting for deployment..."
            sleep 5
          done
          echo "⚠️ Deployment not responding, but proceeding with tests"

      - name: Run E2E tests
        run: npm run test
        working-directory: ./packages/e2e
        env:
          PLAYWRIGHT_TIMEOUT: 30000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.node-version }}
          path: packages/e2e/playwright-report/
          retention-days: 30

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            packages/e2e/test-results/results.xml
          check_name: E2E Test Results

      - name: Comment PR on test failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ E2E tests failed. Please check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
            })

      - name: Comment PR on test success
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ E2E tests passed successfully!'
            })
